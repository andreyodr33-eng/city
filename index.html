<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json" />
<title><PWA Navigator</title>
<style>
 * {
   box-sizing: border-box;
 }      
body{
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}
html,body{
   width:100%;
   overflow-x:hidden;
   margin:0;
   padding:0;
}   

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:20px;

    width:100%;
    max-width:100%;

    overflow:hidden;
}

.wheelWrap{
    position:relative;

    flex:1;

    min-width:110px;
    max-width:160px;
}

.wheel{
    width:100%;
    height:180px;

    overflow-y:scroll;
    overflow-x:hidden;

    scroll-snap-type:y mandatory;

    border:2px solid #444;
    border-radius:16px;

    background:#1b1b1b;

    box-sizing:border-box;

    padding-top:60px;
    padding-bottom:60px;

    scrollbar-width:none;
}

.wheel::-webkit-scrollbar{
    display:none;
}


.wheel:active{
    cursor:grabbing;
}

.item{

    height:60px;

    min-height:60px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    scroll-snap-align:center;

    border-bottom:1px solid #333;

    cursor:pointer;

    user-select:none;

    padding:4px;

    box-sizing:border-box;

    text-align:center;

}
.controls{
    margin-top:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:26px;
    line-height:1.6;
}

#history{
    margin-top:30px;
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
}

.historyItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1b1b1b;
    margin-bottom:10px;
    padding:12px;
    border-radius:10px;
    gap:10px;
}

.historyText{
    text-align:left;
    line-height:1.5;
}

.deleteBtn{
    background:#b00020;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.en{
    color:#00ff88;
    font-size:24px;
    font-weight:bold;
    line-height:1.1;
}

.ru{
    color:white;
    font-size:14px;
    line-height:1.1;
    margin-top:4px;
}


.selector{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:60px;
    transform:translateY(-50%);
    border:3px solid #2e5cff;
    border-radius:12px;
    pointer-events:none;
    z-index:5;
}
</style>

<body>

<h2>Grammar Wheels</h2>

<div class="container">

    <div class="wheelWrap">
        <div class="selector"></div>
        <div class="wheel" id="w1"></div>
    </div>
    <div class="wheelWrap">
        <div class="selector"></div>    
        <div class="wheel" id="w2"></div>
   </div>
   <div class="wheelWrap">
       <div class="selector"></div>   
       <div class="wheel" id="w3"></div>
   </div>    
</div>

<div class="controls">
<button onclick="build()">Build sentence</button>
</div>

<div id="result"></div>

<h3>History</h3>

<div id="history"></div>

<script>

const subjects = [

{ en:"", ru:"", type:"none" }, 

{ en:"I", ru:"Я", type:"human" },

{ en:"You", ru:"Ты", type:"human" },

{ en:"He", ru:"Он", type:"human" },

{ en:"She", ru:"Она", type:"human" },

{ en:"It", ru:"Это", type:"object" },

{ en:"We", ru:"Мы", type:"human" },

{ en:"They", ru:"Они", type:"human" },

{ en:"There", ru:"Там",type:"placeword"},

{ en:"Here", ru:"Здесь",type:"placeword"}

];

const actionRules = [

{en:"",ru:"",mode:"action",forms:{base:"",third:""}},

{en:"be",ru:"быть",mode:"state",forms:{I:"am",You:"are",He:"is",She:"is",It:"is",We:"are",They:"are"}},
{en:"buy",ru:"покупать",mode:"action",forms:{base:"buy",third:"buys"}},

{en:"close",ru:"закрывать",mode:"action",forms:{base:"close",third:"closes"},objects:["door","company","card"]},
{en:"can",ru:"могу",mode:"action",forms:{base:"can",third:"can"}},
{en:"call", ru:"звонить",mode:"action",forms:{base:"call",third:"calls"}},


{en:"drink",ru:"пить",mode:"action",forms:{base:"drink",third:"drinks"}},
{en:"drive", ru:"водить",mode:"action",forms:{base:"drive",third:"drives"},objects:["car","bus"]},

{en:"eat",ru:"есть",mode:"action",forms:{base:"eat",third:"eats"},objects:["food","soup","chicken"]},

{ en:"go to",ru:"идти в",mode:"action",forms:{base:"go to",third:"goes to" }},
{en:"give",ru:"давать",mode:"action",forms:{base:"give",third:"gives"}},
{ en:"get", ru:"получать",mode:"action",forms:{base:"get",third:"gets"}},

{en:"have",ru:"иметь",mode:"action",forms:{base:"have",third:"has"}},
{en:"help", ru:"помогать",mode:"action",forms:{base:"help",third:"helps"}},

{en:"like",ru:"нравится",mode:"action",forms:{base:"like",third:"likes"}},
{en:"live in",ru:"жить в",mode:"action",forms:{base:"live in",third:"lives in"}},
{en:"listen to",ru:"слушать",mode:"action",forms:{base:"listen to",third:"listens to"}},

{en:"need",ru:"нужен",mode:"action",forms:{base:"need",third:"needs"}},

{en:"open",ru:"открывать",mode:"action",forms:{base:"open",third:"opens"}},

{en:"read",ru:"читать",mode:"action",forms:{base:"read",third:"reads"}},

{en:"see",ru:"видеть",mode:"action",forms:{base:"see",third:"sees"}},
{en:"sleep",ru:"спать",mode:"action",forms:{base:"sleep",third:"sleeps"},objects:["bed","home"]},
{en:"sell",ru:"продавать",mode:"action",forms:{base:"sell",third:"sells"},objects:["book","food","car","house","ticket"]},
{en:"study", ru:"учить",mode:"action",forms:{base:"study",third:"studies"}},
{en:"sit on", ru:"сидеть на",mode:"action",forms:{base:"sit on",third:"sits on"}},


{en:"take",ru:"брать",mode:"action",forms:{base:"take",third:"takes"}},
{en:"top up",ru:"пополнить",mode:"action",forms:{base:"top up",third:"tops up"},article:"the"},

{en:"use", ru:"использовать",mode:"action",forms:{base:"use",third:"uses"}},

{en:"want",ru:"хотеть",mode:"action",forms:{base:"want",third:"wants"}},
{en:"work at",ru:"работать в",mode:"action",forms:{base:"work at",third:"works at"}},
{en:"watch",ru:"смотреть",mode:"action",forms:{base:"watch",third:"watches"}}

];

const objects = [

{ en:"",ru:"",type:"object",countable:false },

{en:"bus", ru:"автобус",types:["transport","object"], countable:true},
{en:"book", ru:"книга", types:["object","text","media"], countable:true},
{en:"bed", ru:"кровать",types:["rest","object"],countable:true},
{en:"car", ru:"автомобиль",types:["transport","object"], countable:true},
{en:"city", ru:"город", types:["place"], countable:true},
{en:"card", ru:"карта", types:["object","refillable"], countable:true},
{en:"company", ru:"компания", type:"workplace", countable:true},
{en:"chair", ru:"стул",type:"object", countable:true},
{en:"chicken", ru:"курица",type:"food", countable:false},
{en:"coffee", ru:"кофе",type:"drink", countable:false},
{en:"computer", ru:"компьютер",type:"object", countable:true},

{en:"door", ru:"дверь",types:["object","openable"], countable:true},
{en:"doctor", ru:"врач",types:["person","medical"], countable:true},

{en:"family", ru:"семья", types:["people","group"], countable:true},
{en:"friend", ru:"друг", type:"people", countable:true},
{en:"free", ru:"свободен", type:"state", countable:false},
{en:"food", ru:"еда", type:"food", countable:false},
{en:"ticket", ru:"билет",types:["travel","document"],countable:true},

{en:"home", ru:"дом", type:"place", countable:false, dropArticle:true},
{en:"happy", ru:"счастлив", type:"state", countable:false},
{en:"hospital", ru:"больница", types:["place","workplace","medical"], countable:true},
{en:"help", ru:"помощь", type:"abstract", countable:false},

{en:"lawyer", ru:"юрист",type:"person", countable:true},

{en:"music", ru:"музыка",  types:["media","audio","abstract"], countable:false},
{en:"milk", ru:"молоко",type:"drink", countable:false},
{en:"movie", ru:"фильм", types:["media","visual"], countable:true},

{en:"name", ru:"имя", type:"abstract", countable:true},

{en:"office", ru:"офис", type:"workplace", countable:true},

{en:"picture", ru:"картина", type:"visual", countable:true},
{en:"phone", ru:"телефон",type:"object", countable:true},
{en:"pharmacy", ru:"аптека",types:["place","medical"], countable:true},

{en:"ready", ru:"готов", type:"state", countable:false},

{en:"soup", ru:"суп",type:"food", countable:false},
{en:"spoon", ru:"ложка",type:"object", countable:true},
{en:"student", ru:"студент",types:["person","education"], countable:true},
{en:"school", ru:"школа", type:"place", countable:false},
{en:"shop", ru:"магазин",types:["place"], countable:true},
{en:"script", ru:"рецепт",types:["object","medical"], countable:true},
   
{en:"tea", ru:"чай",type:"drink", countable:false},
{en:"translator", ru:"переводчик",types:["person","language"],countable:true},
{en:"table", ru:"стол",type:"object", countable:true},
{en:"teacher", ru:"учитель",types:["person","education"], countable:true},
 
{en:"water", ru:"вода", type:"drink", countable:false}

];

let selected = { s:0, a:0, o:0 };
let currenObjects = [];
let history =
JSON.parse(localStorage.getItem("history")) || [];

init();

function init(){

renderSubjects();
renderActions();
renderObjects();
renderHistory();

}


function renderSubjects(){

document.getElementById("w1").innerHTML =
subjects.map((s,i)=>

`<div class="item"> 

<div class="en">${s.en}</div>
<div class="ru">${s.ru}</div>

</div>`

).join("");

}

function renderActions(){

document.getElementById("w2").innerHTML =
actionRules.map((a,i)=>

`<div class="item">

<div class="en">${a.en}</div>
<div class="ru">${a.ru}</div>
</div>`

).join("");

}

function renderObjects(){

const action =
actionRules[selected.a];

const allowed =
action?.objects || [];

currentObjects =
[...objects].sort((a,b)=>{

const aGood =
allowed.includes(a.en) ? 1 : 0;

const bGood =
allowed.includes(b.en) ? 1 : 0;

return bGood - aGood;

});

document.getElementById("w3").innerHTML =

currentObjects.map(o=>`

<div class="item">

<div class="en">${o.en}</div>
<div class="ru">${o.ru}</div>

</div>

`).join("");

}
function getActionForm(subject, action){

if(action.mode === "state"){
     return action.forms[subject.en];
}

if(
subject.en==="He" ||
subject.en==="She" ||
subject.en==="It"
){
return action.forms.third;
}

return action.forms.base;

}

function startsWithVowel(word){

return /^[aeiou]/i.test(word);

}

function getArticle(action, object){

if(action.article){
   return action.article + " ";
}

if(object.dropArticle){
return "";
}

if(
action.forms.base==="go to" &&
object.en==="school"
){
return "";
}

if(!object.countable){
return "";
}

return startsWithVowel(object.en)
? "an "
: "a ";

}

const phraseTemplates = {
"you are free":"You are free to go",
"i want book":"I want a book",
"he goes to home":"He goes home",
"she goes to home":"She goes home",
"i drink water":"I drink some water",
"you have translator":"Do you have a translator",
"i need a script":"I need a prescription"
};

function improveSentence(sentence){

const key = sentence
.toLowerCase()
.replace(/[?.!]/g,"")
.replace(/\s+/g," ")
.trim();

if(phraseTemplates[key]){
   return phraseTemplates[key];
}

return sentence;

}
function renderSentence(subject, action, object){
if(!subject || !action || !object){
    return ""; 
}

let actionWord =
getActionForm(subject, action);
if(object.dropPreposition){
actionWord = 
actionWord.replace(" to", "");
}   
const article =
getArticle(action, object);
const prep =
object.needsPreposition || "";   
const parts = [

subject.en,
actionWord,
prep,   
article + object.en

];

return parts
.filter(p => p && p.trim() !== "")
.join(" ");

}

async function translateText(text){

try{

const response = await fetch(
`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ru`
);

const data = await response.json();

return data.responseData.translatedText;

}catch(err){

console.log(err);

return "Ошибка перевода";

}

}

async function build(){

const s = subjects[selected.s];

const a = actionRules[selected.a];

const o = currentObjects[selected.o];

let sentence =
renderSentence(s,a,o);

sentence =
improveSentence(sentence);

const utterance =
new SpeechSynthesisUtterance(sentence);

utterance.lang = "en-US";

const voices =
speechSynthesis.getVoices();

const englishVoice =
voices.find(v =>
v.lang.includes("en")
);

if(englishVoice){
   utterance.voice = englishVoice;
}

speechSynthesis.speak(utterance);

document.getElementById("result").innerHTML =
sentence + "<br>Translating...";

const russian =
await translateText(sentence);

history.unshift({
sentence,
russian
});

localStorage.setItem(
"history",
JSON.stringify(history)
);

renderHistory();

document.getElementById("result").innerHTML =
sentence + "<br>" + russian;

}
function deleteHistory(index){

history.splice(index,1);

localStorage.setItem(
"history",
JSON.stringify(history)
);

renderHistory();

}

function renderHistory(){

document.getElementById("history").innerHTML =
history.map((h,i)=>

`<div class="historyItem">

<div class="historyText">
<div>${h.sentence}</div>
<div>${h.russian}</div>
</div>

<button class="deleteBtn"
onclick="deleteHistory(${i})">
Delete
</button>

</div>`

).join("");

}
document.querySelectorAll(".wheel")
.forEach(wheel => {

let isDown = false;

let startY;

let scrollTop;

wheel.addEventListener("mousedown", e => {

isDown = true;

startY = e.pageY - wheel.offsetTop;

scrollTop = wheel.scrollTop;

});

wheel.addEventListener("mouseleave", () => {

isDown = false;

});

wheel.addEventListener("mousemove", e => {

if(!isDown) return;

e.preventDefault();

const y = e.pageY - wheel.offsetTop;

const walk = (y - startY) * 1.5;

wheel.scrollTop = scrollTop - walk;

});

});

function setupWheel(wheelId,type,array){

const wheel =
document.getElementById(wheelId);

let timeout;

wheel.addEventListener("scroll",()=>{

const itemHeight = 60;

const index =
Math.round(wheel.scrollTop / itemHeight);

if(type==="s"){
selected.s =
Math.max(0,
Math.min(index,array.length-1));
}

if(type==="a"){
selected.a =
Math.max(0,
Math.min(index,array.length-1));
renderObjects();
}

if(type==="o"){
selected.o =
Math.max(0,
Math.min(index,array.length-1));
}

clearTimeout(timeout);

timeout = setTimeout(()=>{

wheel.scrollTo({
top:index * itemHeight,
behavior:"smooth"
});

},100);

});

}
setupWheel("w1","s",subjects);
setupWheel("w2","a",actionRules);
setupWheel("w3","o",objects);

</script>
<script>

if("serviceWorker" in navigator){

navigator.serviceWorker.register("./sw.js")
.then(()=>console.log("SW registered"));

}

</script>
</body>
