<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0,user-scalable=no">
<link rel="manifest" href="manifest.json" />
<title><PWA Navigator</title>
<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:10px;
}

h1{
    margin:10px 0 15px;
    font-size:24px;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    gap:5px;
}

.wheel{
    position:relative;
    width:24%;
    height:150px;
    overflow:hidden;
    background:#222;
    border-radius:14px;
    border:2px solid #444;
}

.track{
    position:absolute;
    width:100%;
    top:0;
    left:0;
    transition:transform 0.15s;
}

.item{
    height:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    user-select:none;
}

.center{
    position:absolute;
    top:50px;
    width:100%;
    height:50px;
    border-top:2px solid #00ff99;
    border-bottom:2px solid #00ff99;
    background:rgba(0,255,153,0.08);
    pointer-events:none;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    background:#00cc88;
    color:white;
    font-size:18px;
}

.result{
    margin-top:20px;
    font-size:28px;
    text-align:center;
    min-height:40px;
    padding:0 10px;
}

.history-panel{

    position:fixed;

    left:0;
    bottom:-100%;

    width:100%;
    height:50%;

    background:#1b1b1b;

    border-top-left-radius:20px;
    border-top-right-radius:20px;

    transition:0.3s;

    overflow-y:auto;

    padding:20px;

}

.history-panel.active{

    bottom:0;

}

.history-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

}

.memory-item{

    background:#2a2a2a;

    padding:12px;

    border-radius:10px;

    margin-bottom:8px;

}

.close-btn{

    background:#ff5555;

}

</style>
</head>

const states = [];

function createWheel(id,data,index){

    const wheel =
        document.getElementById(id);

    const track =
        document.createElement("div");

    track.className = "track";

    wheel.appendChild(track);

    for(let i=0;i<1;i++){

        const empty =
            document.createElement("div");

        empty.className = "item";

        track.appendChild(empty);
}

    data.forEach(word=>{

        const div =
            document.createElement("div");

        div.className = "item";

        div.innerText = word.ru;

        track.appendChild(div);

    });

    for(let i=0;i<1;i++){

        const empty =
            document.createElement("div");

        empty.className = "item";

        track.appendChild(empty);

    }

    states[index] = 0;

    updateWheel(track,index);

    let startY = 0;

    wheel.addEventListener("touchstart",e=>{

        startY =
            e.touches[0].clientY;

    });

    wheel.addEventListener("touchend",e=>{

        let endY =
            e.changedTouches[0].clientY;

        handleSwipe(
            startY-endY,
            index,
            data,
            track
        );

    });

    wheel.addEventListener("mousedown",e=>{

        startY = e.clientY;

    });

    wheel.addEventListener("mouseup",e=>{

        handleSwipe(
            startY-e.clientY,
            index,
            data,
            track
        );

    });

    wheel.addEventListener("wheel",e=>{

        e.preventDefault();

        if(e.deltaY > 0){

            moveDown(index,data);

        }else{

            moveUp(index);

        }

        updateWheel(track,index);

    });

}

function handleSwipe(
    diff,
    index,
    data,
    track
){

    if(Math.abs(diff) < 15){

        return;
    }

    if(diff > 0){

        moveDown(index,data);

    }else{

        moveUp(index);

    }

    updateWheel(track,index);

}

function moveDown(index,data){

    states[index]++;

    if(states[index] >
        data.length-1){

        states[index] =
            data.length-1;
    }

}

function moveUp(index){

    states[index]--;

    if(states[index] < 0){

        states[index] = 0;
    }

}

function updateWheel(track,index){

    const y =
        -(states[index] * itemHeight);

    track.style.transform =
        `translateY(${y}px)`;

}

createWheel("wheel1",wheelsData[0],0);
createWheel("wheel2",wheelsData[1],1);
createWheel("wheel3",wheelsData[2],2);
createWheel("wheel4",wheelsData[3],3);

function getVerbForm(
    subjectObj,
    verbObj
){

    if(
        subjectObj.en === "He" ||
        subjectObj.en === "She" ||
        subjectObj.en === "It"
    ){

        return verbObj.third;

    }

    return verbObj.en;

}
function getVerb(subjectObj, verbObj){

    if(verbObj.en === "be"){
        return verbObj.states[subjectObj.en];
    }

    if(
        subjectObj.en === "He" ||
        subjectObj.en === "She" ||
        subjectObj.en === "It"
    ){
        return verbObj.third;
    }

    return verbObj.en;
}
function buildNaturalSentence(
    subjectObj,
    verbObj,
    objectObj
){

    // специальный шаблон

    if(
        verbObj.p &&
        verbObj.p[objectObj.en]
    ){

        let pattern =
            verbObj.p[objectObj.en];

        return {

            en: pattern[0]
                .replace(
                    "{s}",
                    subjectObj.en
                ),

            ru: pattern[1]
              

        };

    }

    // стандартный шаблон

    let pattern =
        verbObj.p.d;

   
 const verb =
    getVerbForm(
        subjectObj,
        verbObj
    );

 return {

    en: pattern[0]
        .replace("{s}",subjectObj.en)
        .replace("{v}",verb)
        .replace("{o}",objectObj.en),

    ru: pattern[1][subjectObj.en]
      .replace("{or}", objectObj.ru2 || objectObj.ru)
      .replace("{o}", objectObj.ru)
 };
}
 function buildSentence(){

    const subjectObj =
        wheelsData[0][states[0]];

    const verbObj =
        wheelsData[1][states[1]];

    const objectObj =
        wheelsData[3][states[3]];

    const result =
        buildNaturalSentence(
            subjectObj,
            verbObj,
            objectObj
        );

    document.getElementById(
        "result"
    ).innerText = result.en;

    document.getElementById(
        "analysis"
    ).innerHTML =

    `
    <div style="
    color:#00ff99;
    margin-top:10px;
    font-size:22px;
    ">
    ${result.ru}
    </div>
    `;

    speak(result.en);

    saveSentence(result.en);

}

    function speak(text){

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    speech.rate = 0.9;

    speechSynthesis.speak(speech);

}

function saveSentence(sentence){

    let memory =
        JSON.parse(
            localStorage.getItem("memory")
        ) || [];

    memory.unshift(sentence);

    localStorage.setItem(
        "memory",
        JSON.stringify(memory)
    );

    renderMemory();

}
function renderMemory(){

    const memory =
        JSON.parse(
            localStorage.getItem("memory")
        ) || [];

    const list =
        document.getElementById(
            "memoryList"
        );

    list.innerHTML = "";

    memory.forEach((item,index)=>{

        const row =
            document.createElement("div");

        row.className =
            "memory-item";

        row.style.display = "flex";

        row.style.justifyContent =
            "space-between";

        row.style.alignItems =
            "center";

        const text =
            document.createElement("div");

        text.innerText = item;

        const del =
            document.createElement("button");

        del.innerText = "Удалить";

        del.style.background =
            "#ff5555";

        del.style.padding =
            "8px 10px";

        del.style.fontSize =
            "14px";

        del.onclick = ()=>{

            memory.splice(index,1);

            localStorage.setItem(
                "memory",
                JSON.stringify(memory)
            );

            renderMemory();

        };

        row.appendChild(text);

        row.appendChild(del);

        list.appendChild(row);

    });

}
function analyzeSentence(s,v,p,o){

    let analysis =
        document.getElementById(
            "analysis"
        );

    let correct =
        "";
        
    let translate =
        "";

    // he/she/it + s

    if(
        (s === "He" ||
         s === "She" ||
         s === "It")
    ){

        if(v === "have"){

            correct =
                s + " has " + o;

        }

        else if(v === "need"){

            correct =
                s + " needs " + o;

        }

        else if(v === "want"){

            correct =
                s + " wants " + o;

        }

        else if(v === "like"){

            correct =
                s + " likes " + o;

        }

    }


    // like + in = ошибка

    if(v === "like" && p === "in"){

        correct =
            s + " like " + o;

    }

    // go to

    if(v === "go" && p === ""){

        correct =
            s + " go to " + o;

    }

    // перевод

    if(correct.includes("needs")){

        translate =
            "Ему/ей нужно: " + o;

    }

    else if(correct.includes("has")){

        translate =
            "У него/неё есть " + o;

    }

    else if(correct.includes("likes")){

        translate =
            "Ему нравится " + o;

    }

    // вывод

    if(correct !== ""){

        analysis.innerHTML =

        `
        <div style="
        color:#ff6666;
        margin-bottom:10px;
        ">
        ${s} ${v}
        ${p}
        ${o} ❌
        </div>

        <div style="
        color:#00ff99;
        margin-bottom:10px;
        ">
        ${correct} ✅
        </div>

        <div style="
        color:#ffffff;
        font-size:20px;
        ">
        ${translate}
        </div>
        `;

    }else{

        analysis.innerHTML = "";

    }

}

function toggleHistory(){

    document
    .getElementById("historyPanel")
    .classList
    .toggle("active");

}

renderMemory();
