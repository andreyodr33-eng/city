<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PWA Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
 * {
   box-sizing: border-box;
 }      
.search-box {
  position: fixed;
  box-sizing: border-box;
  top: 60px;
  left: 10px;
  right: 10px;

  display: flex;
  gap: 10px;

  z-index: 3000;
}

.search-box input {
  flex: 1;

  padding: 12px;
  box-sizing: border-box;
  border: none;
  border-radius: 10px;
}

.search-box button {
  box-sizing: border-box;
  padding: 12px;

  border: none;
  border-radius: 10px;

  background: #1E88E5;
  color: white;
}
#map {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}


</style>

</head>
<body>

<div id="map"></div>
<div class="search-box">

  <input
    type="text"
    id="addressInput"
    placeholder="Введите адрес">

  <button onclick="setTargetAddress()">
    Поиск
  </button>

</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js">
</script>
<link rel="stylesheet" 
href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
/>
<script>

let map = L.map('map').setView([50.45, 30.52], 15);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19
  }
).addTo(map);

let currentMarker = null;
let routingControl = null;
let targetPoint = null;
let targetMarker = null;
let targetLine = null;
let userTrack = [];
let userTrackLine = null;

async function setTargetAddress() {

  const address =
    document.getElementById("addressInput").value;

  if (!address) {
    return;
  }

  const response = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`
  );

  const data = await response.json();

  if (!data.length) {
    alert("Адрес не найден");
    return;
  }

  const lat = parseFloat(data[0].lat);
  const lng = parseFloat(data[0].lon);

  targetPoint = [lat, lng];

  // marker цели
  if (targetMarker) {
    map.removeLayer(targetMarker);
  }

  targetMarker = L.marker(targetPoint).addTo(map);

  alert("Цель установлена");
  buildRoute();
}
function buildRoute() {

  if (!targetPoint || !currentMarker) {
    return;
  }

  // если уже был маршрут — удалить
  if (routingControl) {
    map.removeControl(routingControl);
  }

  navigator.geolocation.getCurrentPosition((pos) => {

    const start = [pos.coords.latitude, pos.coords.longitude];

    routingControl = L.Routing.control({

      waypoints: [
        L.latLng(start[0], start[1]),
        L.latLng(targetPoint[0], targetPoint[1])
      ],

      lineOptions: {
        styles: [{
          color: 'blue',
          weight: 6
        }]
      },

      routeWhileDragging: false,
      addWaypoints: false,
      draggableWaypoints: false,
      fitSelectedRoutes: true,
      show: false

    }).addTo(map);

  });
}


navigator.geolocation.watchPosition((pos) => {

  const latitude = pos.coords.latitude;
  const longitude = pos.coords.longitude;

  const currentPoint = [latitude, longitude];

  userTrack.push(currentPoint);
  if (userTrackLine) {
    userTrackLine.addLatLng(currentPoint);
  }

  // marker пользователя
  if (currentMarker) {
    map.removeLayer(currentMarker);
  }

  currentMarker =
    L.marker(currentPoint).addTo(map);

  // центр карты
  map.setView(currentPoint);

  // линия до цели
  if (targetPoint) {

    if (targetLine) {
      map.removeLayer(targetLine);
    }

 const currentPoint = [latitude, longitude];

userTrack.push(currentPoint);

if (userTrackLine) {
  userTrackLine.addLatLng(currentPoint);
}

if (currentMarker) {
  map.removeLayer(currentMarker);
}

currentMarker = L.marker(currentPoint).addTo(map);

map.setView(currentPoint);

detectTargetDirection(currentPoint);   
  
 }

},
(err) => {

  alert(err.message);

},
{
  enableHighAccuracy: true
});

</script>
</body>
</html>
