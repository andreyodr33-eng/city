<style>
 * {
   box-sizing: border-box;
 }      
body{
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}
html,body{
   width:100%;
   overflow-x:hidden;
   margin:0;
   padding:0;
}   

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:20px;

    width:100%;
    max-width:100%;

    overflow:hidden;
}

.wheelWrap{
    position:relative;

    flex:1;

    min-width:110px;
    max-width:160px;
}

.wheel{
    width:100%;
    height:180px;

    overflow-y:scroll;
    overflow-x:hidden;

    scroll-snap-type:y mandatory;

    border:2px solid #444;
    border-radius:16px;

    background:#1b1b1b;

    box-sizing:border-box;

    padding-top:60px;
    padding-bottom:60px;

    scrollbar-width:none;
}

.wheel::-webkit-scrollbar{
    display:none;
}


.wheel:active{
    cursor:grabbing;
}

.item{

    height:60px;

    min-height:60px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    scroll-snap-align:center;

    border-bottom:1px solid #333;

    cursor:pointer;

    user-select:none;

    padding:4px;

    box-sizing:border-box;

    text-align:center;

}
.controls{
    margin-top:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:26px;
    line-height:1.6;
}

#history{
    margin-top:30px;
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
}

.historyItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1b1b1b;
    margin-bottom:10px;
    padding:12px;
    border-radius:10px;
    gap:10px;
}

.historyText{
    text-align:left;
    line-height:1.5;
}

.deleteBtn{
    background:#b00020;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.en{
    color:#00ff88;
    font-weight:bold;
    line-height:1.1;
    white-space:nowrap;
    width:100%;
}

.ru{
    color:white;
    font-size:14px;
    line-height:1.1;
    margin-top:4px;
}


.selector{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:60px;
    transform:translateY(-50%);
    border:3px solid #2e5cff;
    border-radius:12px;
    pointer-events:none;
    z-index:5;
}
.historyText{
    cursor:pointer;
}
</style>

function getActionForm(subject, action){

if(action.mode === "state"){
     return action.forms[subject.en];
}

if(subject.person === "third"){
  return action.forms.third;
}

return action.forms.base;

}

function startsWithVowel(word){

return /^[aeiou]/i.test(word);

}

function addAorAn(word){

if(startsWithVowel(word)){
   return "An " + word;
}

return "A " + word;

}

function getSubjectText(subject){

if(subject.articleMode === "indefinite"){
   return addAorAn(subject.en);
}
if(subject.articleMode === "definite"){
   return "The " + subject.en;
}

return subject.en;
}

function getArticle(action, object){

if(action.article){
   return action.article + " ";
}
if(object.article){
   return object.article + " ";
}   
if(object.articleRule === "none"){
   return "";
}
/ для множественного числа /
if(object.plural){
   return "";
}

if(!object.countable){
   return "";
}

return startsWithVowel(object.en)
? "an "
: "a ";

}

function improveSentence(sentence){

const key = sentence
.toLowerCase()
.replace(/[?.!]/g,"")
.replace(/\s+/g," ")
.trim();

if(phraseTemplates[key]){
   return phraseTemplates[key];
}

return sentence;

}

   function renderSentence(subject, action, object){

    if(!subject || !action || !object){
    return "";
    }

    const subjectText = getSubjectText(subject);

    const actionWord = getActionForm(subject, action);

    const rule = getGrammarRule(action, object);

    let prep = object.preposition || rule.prep || "";

    let article = getArticle(action, object);
    console.log("ARTICLE DEBUG:", article);
    console.log("OBJECT:", object.en);
    console.log("COMBINED:", article + object.en);
    if(rule.article === false){
        article = "";
   }
    /*новое правило*/
   if(object.type === "verb_infinitive"){
   
   const toWord =
      action.infinitiveMode === "to"
      ? " to"
      : "";
    return `${getSubjectText(subject)} ${actionWord}${toWord} ${object.en}`;
  }
    return [
        subjectText,
        actionWord,
        prep,
        article + object.en
    ]
    .filter(Boolean)
    .join(" ");
}
async function translateText(text){

try{

const response = await fetch(
`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ru`
);

const data = await response.json();

return data.responseData.translatedText;

}catch(err){

console.log(err);

return "Ошибка перевода";

}

}

function validateLocal(subject, action, object){

    if(!subject || !action || !object){
        return {
            valid:false,
            reason:"Missing data"
        };
    }

    // притяжательные местоимения
    if(subject.mode === "possessive"){

        if(object.en === ""){
            return {
                valid:false,
                reason:"Object required"
            };
        }

        return {
            valid:true
        };
    }

    // пустые значения
    if(subject.en === "" ||
       action.en === "" ||
       object.en === ""){
        return {
            valid:false,
            reason:"Incomplete sentence"
        };
    }

    // если у глагола есть список допустимых объектов
    if(action.objects &&
       action.objects.length){

        if(!action.objects.includes(object.en)){

            return {
                valid:false,
                reason:`"${object.en}" is not used with "${action.en}"`
            };
        }
    }

    return {
        valid:true
    };
}

async function validateGrammar(text){

    try{

        const response = await fetch(
            "https://api.languagetool.org/v2/check",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/x-www-form-urlencoded"
                },
                body:
                    "text=" +
                    encodeURIComponent(text) +
                    "&language=en-US"
            }
        );

        const data =
            await response.json();

        return {
            valid:data.matches.length === 0,
            errors:data.matches
        };

    }catch(err){

        console.log(err);

        return {
            valid:true,
            errors:[]
        };
    }
}

function getGrammarRule(action, object){

    // 1. проверяем исключения
    const ex =
        exceptions[action.en]?.[object.en];

    if(ex){
        return ex;
    }

    // 2. правило по типу существительного
    // const type = object.type;

    // 3. базовое правило глагола
    return {
        prep: action.defaultPreposition || "",
        //article: object.article ? null : false
    };
}

document.querySelectorAll(".wheel")
.forEach(wheel => {

let isDown = false;

let startY;

let scrollTop;

wheel.addEventListener("mousedown", e => {

isDown = true;

startY = e.pageY - wheel.offsetTop;

scrollTop = wheel.scrollTop;

});

wheel.addEventListener("mouseleave", () => {

isDown = false;

});

wheel.addEventListener("mousemove", e => {

if(!isDown) return;

e.preventDefault();

const y = e.pageY - wheel.offsetTop;

const walk = (y - startY) * 1.5;

wheel.scrollTop = scrollTop - walk;

});

});
