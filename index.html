<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PWA Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
  * {
   box-sizing: border-box;
 }  
    /* Убираем всё лишнее */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}
   
.search-box { 
  position: fixed;
  
  top: 60px;
  left: 10px;
  right: 10px;

  display: flex;
  gap: 8px;
  box-sizing: border-box;
  z-index: 3000;
}

.search-box input {
  flex: 1;
  min-width: 0;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  box-sizing: border-box;
}

.search-box button {
  flex-shrink: 0;
  padding: 12px 16px;

  border: none;
  border-radius: 10px;

  background: #1E88E5;
  color: white;
  font-size: 16px;
}
#map {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
  /* ВАЖНО для iPhone */
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
} 
  
#navInfo {

  position: fixed;

  top: 10px;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: 10px;

  z-index: 5000;

  background: rgba(0,0,0,0.7);

  color: white;

  padding: 12px 16px;

  border-radius: 12px;

  font-size: 28px;

  font-weight: bold;
}
</style>
</head>
<body>

<div id="map"></div>
<div id="navInfo">
 ↑ 0 м
</div>  
<div class="search-box">

  <input
    type="text"
    id="addressInput"
    placeholder="Введите адрес">

  <button onclick="setTargetAddress()">
    ПОИСК
  </button>

</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<link rel="stylesheet" 
href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
/>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js">
</script>
<script>
let map = L.map('map', {
  zoomControl: false
}).setView([50.45, 30.52], 15);
let routeRequestId = 0;  
let userTrack = [];
let userTrackLine = L.polyline([], {  
    color: 'red',
    weight: 5
}).addTo(map);
  
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19
  }
).addTo(map);
  
let watchId = null;

let routingControl = null;
let targetPoint = null;
let targetMarker = null;

let lastRouteUpdate = 0;
let routeUpdateInterval = 15000;  
let currentMarker = null;
  
async function setTargetAddress() {

  const address =
    document.getElementById("addressInput").value;

  if (!address) {
    return;
  }

  const response = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`
  );

  const data = await response.json();

  if (!data.length) {
    alert("Адрес не найден");
    return;
  }

  const lat = parseFloat(data[0].lat);
  const lng = parseFloat(data[0].lon);

  targetPoint = [lat, lng];

  // marker цели
  if (targetMarker) {
    map.removeLayer(targetMarker);
  }

  targetMarker = L.marker(targetPoint).addTo(map);

  alert("Цель установлена");
  buildRoute();
}
function buildRoute() {

  if (!targetPoint || !currentMarker) {
    return;
  }

  // если уже был маршрут — удалить
  if (routingControl) {
    map.removeControl(routingControl);
  }

  navigator.geolocation.getCurrentPosition((pos) => {

    const start = [pos.coords.latitude, pos.coords.longitude];

    routingControl = L.Routing.control({

      waypoints: [
        L.latLng(start[0], start[1]),
        L.latLng(targetPoint[0], targetPoint[1])
      ],

      lineOptions: {
        styles: [{
          color: 'blue',
          weight: 5
        }]
      },

      routeWhileDragging: false,
      addWaypoints: false,
      draggableWaypoints: false,
      fitSelectedRoutes: true,
      show: false

    }).addTo(map);
 });
}  
  navigator.geolocation.watchPosition((pos) => {

  const latitude = pos.coords.latitude;
  const longitude = pos.coords.longitude;

  const currentPoint = [latitude, longitude];

  // добавление точки в красный трек
  userTrack.push(currentPoint);

  if (userTrackLine) {
    userTrackLine.addLatLng(currentPoint);
  }

  // обновление маркера пользователя
  if (currentMarker) {
    map.removeLayer(currentMarker);
  }

  currentMarker = L.marker(currentPoint).addTo(map);

  // плавное движение карты
  map.setView(currentPoint); 

  // обновление маршрута
  if (targetPoint) {
    updateRoute(currentPoint);
  }

},
(err) => {

  alert(err.message);

},
{
  enableHighAccuracy: true,
  maximumAge: 1000,
  timeout: 10000
});
  
   function updateRoute(currentPoint) {

  if (!targetPoint) return;

  // увеличиваем ID запроса
  const myRequest = ++routeRequestId;

  // удаляем старый маршрут
  if (routingControl) {
    map.removeControl(routingControl);
    routingControl = null;
  }

  routingControl = L.Routing.control({

    waypoints: [
      L.latLng(currentPoint[0], currentPoint[1]),
      L.latLng(targetPoint[0], targetPoint[1])
    ],

    lineOptions: {
      styles: [{
        color: 'blue',
        weight: 5
      }]
    },

    routeWhileDragging: false,
    addWaypoints: false,
    draggableWaypoints: false,
    show: false
  
  }).addTo(map);
 routingControl.on('routesfound', function(e) {

  const route = e.routes[0];

  if (!route.instructions.length) {
    return;
  }

  const step = route.instructions[0];

  let arrow = "↑";

  const text = step.text.toLowerCase();

  if (text.includes("left")) {
    arrow = "←";
  }

  if (text.includes("right")) {
    arrow = "→";
  }

  if (text.includes("uturn")) {
    arrow = "↓";
  }

  document.getElementById("navInfo").innerText =
    arrow + " " + Math.round(step.distance) + " м";
});  

  routingControl.on('routesfound', function () {
    // если уже появился новый запрос — игнорируем результат
    if (myRequest !== routeRequestId) {
      map.removeControl(routingControl);
      routingControl = null;
    }
  });

  routingControl.addTo(map);
} 
</script>
</body>
</html>
