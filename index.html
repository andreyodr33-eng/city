<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json" />
<title>PWA Navigator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

.wrapper{
    width:100%;
    max-width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px;
}

h1{
    font-size:26px;
    margin:10px 0 20px;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    gap:6px;
}

.wheel{
    position:relative;
    width:24vw;
    max-width:140px;
    min-width:78px;
    height:350px;
    overflow:hidden;
    background:#222;
    border-radius:16px;
    border:2px solid #444;
}

.track{
    position:absolute;
    width:100%;
    top:0;
    left:0;
    transition:transform 0.15s;
}

.item{
    height:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    user-select:none;
}

.center{
    position:absolute;
    top:150px;
    width:100%;
    height:50px;
    border-top:2px solid #00ff99;
    border-bottom:2px solid #00ff99;
    background:rgba(0,255,153,0.08);
    pointer-events:none;
}

button{
    margin-top:25px;
    padding:14px 24px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#00cc88;
    color:white;
}

.result{
    margin-top:20px;
    font-size:30px;
    text-align:center;
    min-height:45px;
    padding:0 10px;
}

.memory{
    width:95%;
    max-width:700px;
    margin-top:25px;
}

.memory-item{
    background:#222;
    padding:10px;
    border-radius:10px;
    margin-top:6px;
}

</style>
</head>
<body>

<div class="wrapper">

<h1>English Constructor</h1>

<div class="container">

<div class="wheel" id="wheel1">
<div class="center"></div>
</div>

<div class="wheel" id="wheel2">
<div class="center"></div>
</div>

<div class="wheel" id="wheel3">
<div class="center"></div>
</div>

<div class="wheel" id="wheel4">
<div class="center"></div>
</div>

</div>

<button onclick="buildSentence()">
Собрать предложение
</button>

<div class="result" id="result"></div>

<div class="memory">

<h2>Память</h2>

<div id="memoryList"></div>

</div>

</div>

<script>

const itemHeight = 50;

const wheelsData = [

[
{ru:"Я", en:"I"},
{ru:"Ты", en:"You"},
{ru:"Он", en:"He"},
{ru:"Она", en:"She"},
{ru:"Это", en:"It"},
{ru:"Мы", en:"We"},
{ru:"Они", en:"They"}
],

[
{ru:"хочу", en:"want"},
{ru:"нуждаюсь", en:"need"},
{ru:"люблю", en:"like"},
{ru:"вижу", en:"see"},
{ru:"имею", en:"have"},
{ru:"знаю", en:"know"},
{ru:"ем", en:"eat"}
],

[
{ru:"", en:""},
{ru:"в", en:"in"},
{ru:"на", en:"on"},
{ru:"с", en:"with"},
{ru:"для", en:"for"},
{ru:"к", en:"to"},
{ru:"из", en:"from"}
],

[
{ru:"вода", en:"water"},
{ru:"еда", en:"food"},
{ru:"деньги", en:"money"},
{ru:"работа", en:"work"},
{ru:"город", en:"city"},
{ru:"семья", en:"family"},
{ru:"помощь", en:"help"}
]

];

const states = [];

function createWheel(id,data,index){

    const wheel =
        document.getElementById(id);

    const track =
        document.createElement("div");

    track.className = "track";

    wheel.appendChild(track);

    // 3 пустых сверху

    for(let i=0;i<3;i++){

        const empty =
            document.createElement("div");

        empty.className = "item";

        empty.innerHTML = "&nbsp;";

        track.appendChild(empty);

    }

    // слова

    data.forEach(word=>{

        const div =
            document.createElement("div");

        div.className = "item";

        div.innerText = word.ru;

        track.appendChild(div);

    });

    // 3 пустых снизу

    for(let i=0;i<3;i++){

        const empty =
            document.createElement("div");

        empty.className = "item";

        empty.innerHTML = "&nbsp;";

        track.appendChild(empty);

    }

    states[index] = 0;

    updateWheel(track,index);

    // mouse wheel

    wheel.addEventListener("wheel",e=>{

        e.preventDefault();

        if(e.deltaY > 0){
moveDown(index,data);

        }else{

            moveUp(index);

        }

        updateWheel(track,index);

    });

    // drag mouse

    let startY = 0;

    wheel.addEventListener("mousedown",e=>{

        startY = e.clientY;

    });

    wheel.addEventListener("mouseup",e=>{

        let diff =
            startY - e.clientY;

        processSwipe(diff,index,data,track);

    });

    // touch

    wheel.addEventListener("touchstart",e=>{

        startY =
            e.touches[0].clientY;

    });

    wheel.addEventListener("touchend",e=>{

        let diff =
            startY -
            e.changedTouches[0].clientY;

        processSwipe(diff,index,data,track);

    });

}

function processSwipe(
    diff,
    index,
    data,
    track
){

    if(Math.abs(diff) < 15){

        return;
    }

    if(diff > 0){

        moveDown(index,data);

    }else{

        moveUp(index);

    }

    updateWheel(track,index);

}

function moveDown(index,data){

    states[index]++;

    if(states[index] >
        data.length - 1){

        states[index] =
            data.length - 1;
    }

}

function moveUp(index){

    states[index]--;

    if(states[index] < 0){

        states[index] = 0;
    }

}

function updateWheel(track,index){

    const translateY =
        -(states[index] * itemHeight);

    track.style.transform =
        `translateY(${translateY}px)`;

}

createWheel("wheel1",wheelsData[0],0);
createWheel("wheel2",wheelsData[1],1);
createWheel("wheel3",wheelsData[2],2);
createWheel("wheel4",wheelsData[3],3);

function buildSentence(){

    const s =
        wheelsData[0][states[0]].en;

    const v =
        wheelsData[1][states[1]].en;

    const p =
        wheelsData[2][states[2]].en;

    const o =
        wheelsData[3][states[3]].en;

    let sentence =
        s + " " + v;

    if(p !== ""){

        sentence += " " + p;

    }

    sentence += " " + o;

    document.getElementById(
        "result"
    ).innerText = sentence;

    speak(sentence);

    saveSentence(sentence);

}

function speak(text){

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    speech.rate = 0.9;

    speechSynthesis.speak(speech);

}

function saveSentence(sentence){

    let memory =
        JSON.parse(
            localStorage.getItem("memory")
        ) || [];

    memory.unshift(sentence);

    localStorage.setItem(
        "memory",
        JSON.stringify(memory)
    );

    renderMemory();

}

function renderMemory(){

    const memory =
        JSON.parse(
            localStorage.getItem("memory")
        ) || [];

    const list =
        document.getElementById(
            "memoryList"
        );

    list.innerHTML = "";

    memory.forEach(item=>{

        const div =
            document.createElement("div");

        div.className =
            "memory-item";

        div.innerText = item;

        list.appendChild(div);

    });

}

renderMemory();

</script>

</body>
</html>
