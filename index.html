<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PWA Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
     
.search-box {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  
  left: 10px;
  right: 10px;

  display: flex;
  gap: 10px;

  z-index: 5000;
}

.search-box input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
}

.search-box button {
  
  padding: 12px;

  border: none;
  border-radius: 10px;
  font-size: 16px;
  background: #1E88E5;
  color: white;
}
#map {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
#routeInfo {

  position: fixed;

  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);

  left: 50%;

  transform: translateX(-50%);

  z-index: 5000;

  background: rgba(0,0,0,0.75);

  backdrop-filter: blur(8px);

  color: white;

  padding: 12px 18px;

  border-radius: 14px;

  font-size: 22px;

  font-weight: bold;

  white-space: nowrap;
}

</style>

</head>
<body>

<div id="map"></div>
<div class="search-box">
<div id="routeInfo"> 0 км : 0 мин </div>
  <input
    type="text"
    id="addressInput"
    placeholder="Введите адрес">

  <button onclick="setTargetAddress()">
    Поиск
  </button>

</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js">
</script>
<link rel="stylesheet" 
href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
/>
<script>

let map = L.map('map', {
  zoomControl: false
  }).setView([50.45, 30.52], 17);

L.tileLayer(
  'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
  {
    maxZoom: 19
  }
).addTo(map);
let currentMarker = null;
let routingControl = null;
let targetPoint = null;
let targetMarker = null;
let targetLine = null;
let userTrack = [];
let userTrackLine = null;

userTrackLine = L.polyline([], {
  color: 'red',
  weight: 6
}).addTo(map);    

async function setTargetAddress() {

  const address =
    document.getElementById("addressInput").value;

  if (!address) {
    return;
  }

  const response = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`
  );

  const data = await response.json();

  if (!data.length) {
    alert("Адрес не найден");
    return;
  }

  const lat = parseFloat(data[0].lat);
  const lng = parseFloat(data[0].lon);

  targetPoint = [lat, lng];

  // marker цели
  if (targetMarker) {
    map.removeLayer(targetMarker);
  }

  targetMarker = L.marker(targetPoint).addTo(map);

  alert("Цель установлена");
  buildRoute();
}
function buildRoute() {

  if (!targetPoint || !currentMarker) {
    return;
  }

  // если уже был маршрут — удалить
  if (routingControl) {
    map.removeControl(routingControl);
  }

  navigator.geolocation.getCurrentPosition((pos) => {

    const start = [pos.coords.latitude, pos.coords.longitude];

    routingControl = L.Routing.control({
         waypoints: [
        L.latLng(start[0], start[1]),
        L.latLng(targetPoint[0], targetPoint[1])
      ],

      lineOptions: {
        styles: [{
          color: 'blue',
          weight: 6
        }]
      },

      routeWhileDragging: false,
      addWaypoints: false,
      draggableWaypoints: false,
      fitSelectedRoutes: true,
      show: false

    }).addTo(map);

 
routingControl.on('routesfound', function(e) {

  const route = e.routes[0];

  const distanceKm =
    (route.summary.totalDistance / 1000).toFixed(1);

  const timeMin =
    Math.round(route.summary.totalTime / 60);

  document.getElementById("routeInfo").innerText =
    distanceKm + " км • " + timeMin + " мин";

  });
 });
}
navigator.geolocation.watchPosition((pos) => {

  const latitude = pos.coords.latitude;
  const longitude = pos.coords.longitude;

  const currentPoint = [latitude, longitude];

  userTrack.push(currentPoint);
  if (userTrackLine) {
    userTrackLine.addLatLng(currentPoint);
  }

  // marker пользователя
  if (currentMarker) {
    map.removeLayer(currentMarker);
  }

  currentMarker =
    L.marker(currentPoint).addTo(map);

  // центр карты
  map.setView(currentPoint);

  // линия до цели
  if (targetPoint) {

    if (targetLine) {
      map.removeLayer(targetLine);
    }

 if (currentMarker) {
  map.removeLayer(currentMarker);
}

currentMarker = L.marker(currentPoint).addTo(map);

map.setView(currentPoint);

detectTargetDirection(currentPoint);   
  
 }

},
(err) => {

  alert(err.message);

},
{
  enableHighAccuracy: true
});

</script>
</body>
</html>
