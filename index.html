<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json" />
<title><PWA Navigator</title>
<style>
 * {
   box-sizing: border-box;
 }      
body{
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}
html,body{
   width:100%;
   overflow-x:hidden;
   margin:0;
   padding:0;
}   

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:20px;

    width:100%;
    max-width:100%;

    overflow:hidden;
}

.wheelWrap{
    position:relative;

    flex:1;

    min-width:110px;
    max-width:160px;
}

.wheel{
    width:100%;
    height:180px;

    overflow-y:scroll;
    overflow-x:hidden;

    scroll-snap-type:y mandatory;

    border:2px solid #444;
    border-radius:16px;

    background:#1b1b1b;

    box-sizing:border-box;

    padding-top:60px;
    padding-bottom:60px;

    scrollbar-width:none;
}

.wheel::-webkit-scrollbar{
    display:none;
}


.wheel:active{
    cursor:grabbing;
}

.item{

    height:60px;

    min-height:60px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    scroll-snap-align:center;

    border-bottom:1px solid #333;

    cursor:pointer;

    user-select:none;

    padding:4px;

    box-sizing:border-box;

    text-align:center;

}
.controls{
    margin-top:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:26px;
    line-height:1.6;
}

#history{
    margin-top:30px;
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
}

.historyItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1b1b1b;
    margin-bottom:10px;
    padding:12px;
    border-radius:10px;
    gap:10px;
}

.historyText{
    text-align:left;
    line-height:1.5;
}

.deleteBtn{
    background:#b00020;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.en{
    color:#00ff88;
    font-size:24px;
    font-weight:bold;
    line-height:1.1;
}

.ru{
    color:white;
    font-size:14px;
    line-height:1.1;
    margin-top:4px;
}


.selector{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:60px;
    transform:translateY(-50%);
    border:3px solid #2e5cff;
    border-radius:12px;
    pointer-events:none;
    z-index:5;
}
</style>

<body>

<h2>Grammar Wheels</h2>

<div class="container">

    <div class="wheelWrap">
        <div class="selector"></div>
        <div class="wheel" id="w1"></div>
    </div>
    <div class="wheelWrap">
        <div class="selector"></div>    
        <div class="wheel" id="w2"></div>
   </div>
   <div class="wheelWrap">
       <div class="selector"></div>   
       <div class="wheel" id="w3"></div>
   </div>    
</div>

<div class="controls">
<button onclick="build()">Build sentence</button>
</div>

<div id="result"></div>

<h3>History</h3>

<div id="history"></div>

<script>


const subjects = [

{ en:"", ru:"", type:"none" }, 

{ en:"I", ru:"Я", type:"human" },

{ en:"You", ru:"Ты", type:"human" },

{ en:"He", ru:"Он", type:"human" },

{ en:"She", ru:"Она", type:"human" },

{ en:"It", ru:"Это", type:"object" },

{ en:"We", ru:"Мы", type:"human" },

{ en:"They", ru:"Они", type:"human" }

];



const actionRules = [

{en:"",ru:"",mode:"action",forms:{base:"",third:""},types:["drink","food","object","media","visual","place","people","abstract","workplace","refillable"]},

{en:"be",ru:"быть",mode:"state",forms:{I:"am",You:"are",He:"is",She:"is",It:"is",We:"are",They:"are"},types:["state"]},

{en:"want",ru:"хотеть",mode:"action",forms:{base:"want",third:"wants"},types:["drink","food","object","media","visual","place","people","abstract"]},

{en:"need",ru:"нуждаться",mode:"action",forms:{base:"need",third:"needs"},types:["drink","food","object","media","visual","place","people","abstract"]},

{en:"like",ru:"нравиться",mode:"action",forms:{base:"like",third:"likes"},types:["food","object","media","visual"]},

{en:"see",ru:"видеть",mode:"action",forms:{base:"see",third:"sees"},subjectTypes:["human","object"],types:["object","visual","place","people"]},

{en:"have",ru:"иметь",mode:"action",forms:{base:"have",third:"has"},types:["object","people","abstract"]},

{en:"go to",ru:"идти в",mode:"action",forms:{base:"go to",third:"goes to"},types:["place"]},

{en:"live in",ru:"жить в",mode:"action",forms:{base:"live in",third:"lives in"},types:["place"]},

{en:"work at",ru:"работать в",mode:"action",forms:{base:"work at",third:"works at"},subjectTypes:["human"],types:["workplace"]},

{en:"eat",ru:"есть",mode:"action",forms:{base:"eat",third:"eats"},subjectTypes:["human"],types:["food"]},

{en:"drink",ru:"пить",mode:"action",forms:{base:"drink",third:"drinks"},subjectTypes:["human"],types:["drink"]},

{en:"give",ru:"давать",mode:"action",forms:{base:"give",third:"gives"},types:["object","food","drink"]},

{en:"take",ru:"брать",mode:"action",forms:{base:"take",third:"takes"},types:["object","abstract"]},

{en:"watch",ru:"смотреть",mode:"action",forms:{base:"watch",third:"watches"},types:["media","visual","people"]},

{en:"top up",ru:"пополнить",mode:"action",forms:{base:"top up",third:"tops up"},types:["refillable"],article:"the"}

];



const objects = [

{ en:"",ru:"",type:"object",countable:false },

{ en:"free", ru:"свободен", type:"state", countable:false },

{ en:"happy", ru:"счастлив", type:"state", countable:false },
 
{ en:"ready", ru:"готов", type:"state", countable:false },

{ en:"water", ru:"вода", type:"drink", countable:false },

{ en:"food", ru:"еда", type:"food", countable:false },

{ en:"book", ru:"книга", type:"object", countable:true },

{ en:"movie", ru:"фильм", type:"media", countable:true },

{ en:"picture", ru:"картина", type:"visual", countable:true },

{ en:"school", ru:"школа", type:"place", countable:true },

{ en:"home", ru:"дом", type:"place", countable:false },

{ en:"city", ru:"город", type:"place", countable:true },

{ en:"family", ru:"семья", type:"people", countable:true },

{ en:"friend", ru:"друг", type:"people", countable:true },

{ en:"company", ru:"компания", type:"workplace", countable:true },

{ en:"office", ru:"офис", type:"workplace", countable:true },

{ en:"hospital", ru:"больница", type:"workplace", countable:true },

{ en:"music", ru:"музыка",  type:"media", countable:false },

{ en:"help", ru:"помощь", type:"abstract", countable:false },

{ en:"card", ru:"карта", type:"refillable", countable:true },

{ en:"name", ru:"имя", type:"abstract", countable:true }

];

let selected = { s:0, a:0, o:0 };

let filteredActions = [];
let filteredObjects = [];

let history =
JSON.parse(localStorage.getItem("history")) || [];

init();

function init(){

renderSubjects();

filterActions();

filterObjects();

renderHistory();

}


function renderSubjects(){

document.getElementById("w1").innerHTML =
subjects.map((s,i)=>

`<div class="item"> 

<div class="en">${s.en}</div>
<div class="ru">${s.ru}</div>

</div>`

).join("");

}

function renderActions(){

document.getElementById("w2").innerHTML =
filteredActions.map((a,i)=>

`<div class="item">

<div class="en">${a.en}</div>
<div class="ru">${a.ru}</div>
</div>`

).join("");

}

function renderObjects(){

document.getElementById("w3").innerHTML =
filteredObjects.map((o,i)=>

`<div class="item">

<div class="en">${o.en}</div>
<div class="ru">${o.ru}</div>
</div>`

).join("");

}

function filterActions(){

const subject =
subjects[selected.s];

filteredActions =
actionRules.filter(action =>

!action.subjectTypes ||

action.subjectTypes.includes(subject.type)

);

selected.a = 0;

renderActions();

}

function filterObjects(){

const action = filteredActions[selected.a];

if(!action) return;

filteredObjects = objects.filter(o =>
action.types.includes(o.type)
);

selected.o = 0;

renderObjects();

}

function getActionForm(subject, action){

if(action.mode === "state"){
     return action.forms[subject.en];
}

if(
subject.en==="He" ||
subject.en==="She" ||
subject.en==="It"
){
return action.forms.third;
}

return action.forms.base;

}

function startsWithVowel(word){

return /^[aeiou]/i.test(word);

}

function getArticle(action, object){

if(action.article){
   return action.article + " ";
}

if(object.en==="home"){
return "";
}

if(
action.forms.base==="go to" &&
object.en==="school"
){
return "";
}

if(!object.countable){
return "";
}

return startsWithVowel(object.en)
? "an "
: "a ";

}

function renderSentence(subject, action, object){

const actionWord =
getActionForm(subject, action);

const article =
getArticle(action, object);

const parts = [

subject.en,
actionWord,
article + object.en

];

return parts
.filter(p => p && p.trim() !== "")
.join(" ");

}

async function translateText(text){

try{

const response = await fetch(
`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ru`
);

const data = await response.json();

return data.responseData.translatedText;

}catch(err){

console.log(err);

return "Ошибка перевода";

}

}

async function build(){

const s = subjects[selected.s];

const a = filteredActions[selected.a];

const o = filteredObjects[selected.o];

const sentence =
renderSentence(s,a,o);

const utterance =
new SpeechSynthesisUtterance(sentence);

utterance.lang = "en-US";

const voices =
speechSynthesis.getVoices();

const englishVoice =
voices.find(v =>
v.lang.includes("en")
);

if(englishVoice){
   utterance.voice = englishVoice;
}

speechSynthesis.speak(utterance);

document.getElementById("result").innerHTML =
sentence + "<br>Translating...";

const russian =
await translateText(sentence);

history.unshift({
sentence,
russian
});

localStorage.setItem(
"history",
JSON.stringify(history)
);

renderHistory();

document.getElementById("result").innerHTML =
sentence + "<br>" + russian;

}
function deleteHistory(index){

history.splice(index,1);

localStorage.setItem(
"history",
JSON.stringify(history)
);

renderHistory();

}

function renderHistory(){

document.getElementById("history").innerHTML =
history.map((h,i)=>

`<div class="historyItem">

<div class="historyText">
<div>${h.sentence}</div>
<div>${h.russian}</div>
</div>

<button class="deleteBtn"
onclick="deleteHistory(${i})">
Delete
</button>

</div>`

).join("");

}
document.querySelectorAll(".wheel")
.forEach(wheel => {

let isDown = false;

let startY;

let scrollTop;

wheel.addEventListener("mousedown", e => {

isDown = true;

startY = e.pageY - wheel.offsetTop;

scrollTop = wheel.scrollTop;

});

wheel.addEventListener("mouseleave", () => {

isDown = false;

});

wheel.addEventListener("mouseup", () => {

isDown = false;

});

wheel.addEventListener("mousemove", e => {

if(!isDown) return;

e.preventDefault();

const y = e.pageY - wheel.offsetTop;

const walk = (y - startY) * 1.5;

wheel.scrollTop = scrollTop - walk;

});

});

function setupWheel(wheelId,type){

const wheel = document.getElementById(wheelId);

wheel.addEventListener("scroll",()=>{

const index =
Math.round(wheel.scrollTop / 60);

if(type==="s"){

selected.s =
Math.max(0,
Math.min(index,subjects.length-1));

filterActions();
filterObjects();
renderSubjects();

}

if(type==="a"){

selected.a =
Math.max(0,
Math.min(index,filteredActions.length-1));

filterObjects();
renderActions();

}

if(type==="o"){

selected.o =
Math.max(0,
Math.min(index,filteredObjects.length-1));

}

});

}

setupWheel("w1","s");
setupWheel("w2","a");
setupWheel("w3","o");

document.querySelectorAll(".wheel")
.forEach(wheel => {

let timeout;

wheel.addEventListener("scroll",()=>{

clearTimeout(timeout);

timeout = setTimeout(()=>{

const itemHeight = 60;

const index =
Math.round(wheel.scrollTop / itemHeight);

wheel.scrollTo({
top:index * itemHeight,
behavior:"smooth"
});

},80);

});

});
</script>

</body>
</html>
